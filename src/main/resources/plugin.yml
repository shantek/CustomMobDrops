name: CustomMobDrops
api-version: 1.21
version: 0.3.0
author: shantek.io
main: io.shantek.CustomMobDrops

commands:
  custommobdrops:
    description: Main command for managing custom mob drops.
    usage: /custommobdrops [reload | enable | disable | list]
    aliases: [drops]
    subcommands:
      reload:
        description: Reload the plugin config
        usage: /custommobdrops reload
      enable:
        description: Enable custom drops globally, or for a specific mob
        usage: /custommobdrops enable [mob]
      disable:
        description: Disable custom drops globally, or for a specific mob
        usage: /custommobdrops disable [mob]
      list:
        description: List all configured mobs and their enabled state
        usage: /custommobdrops list

permissions:
  shantek.custommobdrops.reload:
    description: Allows the player to reload the plugin
    default: op
  shantek.custommobdrops.enable:
    description: Allows the player to enable or disable custom drops globally
    default: op
  shantek.custommobdrops.manage:
    description: Allows the player to enable or disable drops for specific mobs
    default: op
